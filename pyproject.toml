[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perceptparser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "austin-dist>=3.7.0",
    "fastparquet>=2024.11.0",
    "matplotlib>=3.10.3",
    "mne>=1.9.0",
    "numpy>=2.3.0",
    "pandas==3.*",
    "pyarrow>=24.0.0",
    "pynwb>=3.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "specparam>=2.0.0rc7",
    "tqdm>=4.67.1",
]
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["percept_parser*"]
